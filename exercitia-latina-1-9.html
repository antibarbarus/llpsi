<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercitium 1.9</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono&display=swap">
    <style>
        ul {
            list-style-type: none;
            padding-left: 0;
            margin: 10px 0;
        }
        li {
            margin-bottom: 5px;
        }
        body {
            margin: 20px;
            font-family: 'Fira Mono', monospace;
            font-size: 16px;
            line-height: 1.6;
        }
        input[type="text"] {
            font-family: 'Fira Mono', monospace;
            padding: 5px;
            font-size: 16px;
            width: 300px;
            transition: background-color 0.3s;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .result {
            font-weight: bold;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
        }
        .correct { background-color: lightgreen; }
        .almost-correct { background-color: gold; }
        .incorrect { background-color: lightcoral; }
        .exercise-text {
            margin-bottom: 20px;
        }
        p {
            margin-bottom: 15px;
        }
        .instructions {
            margin-bottom: 20px;
            font-style: italic;
        }
        .question {
            margin-bottom: 20px;
        }
        .hint {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
            font-style: italic;
            display: none;
        }
        .hint.visible {
            display: block;
        }
        .word-hint {
            display: inline-block;
            margin-right: 10px;
            color: #888;
        }
    </style>
</head>
